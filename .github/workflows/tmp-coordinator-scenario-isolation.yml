name: Temporary Coordinator scenario isolation

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Isolate coordinator scenarios by process'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Isolate State singleton scenarios
        shell: python
        run: |
          from pathlib import Path

          test = Path('tests/ota_coordinator_test.cpp')
          text = test.read_text()

          # Remove the ineffective per-fixture shutdown. ESPressio-State owns one
          # process-global Type runtime family; scenarios are isolated by process below.
          text = text.replace("\n    ~Fixture() {\n        (void)StateRuntime.Shutdown();\n    }\n", "", 1)

          anchor = "int main() {\n    if (!InstallIdentity()) return 1;\n\n    {\n"
          replacement = ("#ifndef ESPRESSIO_OTA_COORDINATOR_SCENARIO\n"
                         "#define ESPRESSIO_OTA_COORDINATOR_SCENARIO 1\n"
                         "#endif\n\n"
                         "int main() {\n"
                         "    if (!InstallIdentity()) return 1;\n\n"
                         "#if ESPRESSIO_OTA_COORDINATOR_SCENARIO == 1\n"
                         "    {\n")
          if text.count(anchor) != 1:
              raise RuntimeError('main scenario-1 anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          anchor2 = "\n    {\n        Fixture fixture;\n        if (!fixture.InitializeState()) return 20;"
          repl2 = "\n#elif ESPRESSIO_OTA_COORDINATOR_SCENARIO == 2\n    {\n        Fixture fixture;\n        if (!fixture.InitializeState()) return 20;"
          if text.count(anchor2) != 1:
              raise RuntimeError('scenario-2 anchor mismatch')
          text = text.replace(anchor2, repl2, 1)

          anchor3 = "\n    {\n        Fixture fixture;\n        if (!fixture.InitializeState()) return 50;"
          repl3 = "\n#elif ESPRESSIO_OTA_COORDINATOR_SCENARIO == 3\n    {\n        Fixture fixture;\n        if (!fixture.InitializeState()) return 50;"
          if text.count(anchor3) != 1:
              raise RuntimeError('scenario-3 anchor mismatch')
          text = text.replace(anchor3, repl3, 1)

          tail = "\n    return 0;\n}\n"
          replacement_tail = ("\n#else\n"
                              "#error Unsupported ESPRESSIO_OTA_COORDINATOR_SCENARIO\n"
                              "#endif\n\n"
                              "    return 0;\n"
                              "}\n")
          if text.count(tail) != 1:
              raise RuntimeError('main tail mismatch')
          text = text.replace(tail, replacement_tail, 1)
          test.write_text(text)

          cmake = Path('tests/CMakeLists.txt')
          text = cmake.read_text()
          old = ("add_executable(espressio_ota_coordinator_test ota_coordinator_test.cpp)\n"
                 "target_link_libraries(espressio_ota_coordinator_test PRIVATE ESPressio::OTA)\n"
                 "target_compile_options(espressio_ota_coordinator_test PRIVATE ${ESPRESSIO_OTA_NATIVE_COMPILE_OPTIONS})\n"
                 "add_test(NAME espressio_ota_coordinator_test COMMAND espressio_ota_coordinator_test)\n")
          new = ("add_executable(espressio_ota_coordinator_test ota_coordinator_test.cpp)\n"
                 "target_link_libraries(espressio_ota_coordinator_test PRIVATE ESPressio::OTA)\n"
                 "target_compile_options(espressio_ota_coordinator_test PRIVATE ${ESPRESSIO_OTA_NATIVE_COMPILE_OPTIONS})\n"
                 "target_compile_definitions(espressio_ota_coordinator_test PRIVATE ESPRESSIO_OTA_COORDINATOR_SCENARIO=1)\n"
                 "add_test(NAME espressio_ota_coordinator_test COMMAND espressio_ota_coordinator_test)\n\n"
                 "add_executable(espressio_ota_coordinator_activation_test ota_coordinator_test.cpp)\n"
                 "target_link_libraries(espressio_ota_coordinator_activation_test PRIVATE ESPressio::OTA)\n"
                 "target_compile_options(espressio_ota_coordinator_activation_test PRIVATE ${ESPRESSIO_OTA_NATIVE_COMPILE_OPTIONS})\n"
                 "target_compile_definitions(espressio_ota_coordinator_activation_test PRIVATE ESPRESSIO_OTA_COORDINATOR_SCENARIO=2)\n"
                 "add_test(NAME espressio_ota_coordinator_activation_test COMMAND espressio_ota_coordinator_activation_test)\n\n"
                 "add_executable(espressio_ota_coordinator_rollback_test ota_coordinator_test.cpp)\n"
                 "target_link_libraries(espressio_ota_coordinator_rollback_test PRIVATE ESPressio::OTA)\n"
                 "target_compile_options(espressio_ota_coordinator_rollback_test PRIVATE ${ESPRESSIO_OTA_NATIVE_COMPILE_OPTIONS})\n"
                 "target_compile_definitions(espressio_ota_coordinator_rollback_test PRIVATE ESPRESSIO_OTA_COORDINATOR_SCENARIO=3)\n"
                 "add_test(NAME espressio_ota_coordinator_rollback_test COMMAND espressio_ota_coordinator_rollback_test)\n")
          if text.count(old) != 1:
              raise RuntimeError('coordinator CMake target anchor mismatch')
          text = text.replace(old, new, 1)
          old_list = "    espressio_ota_coordinator_test\n)"
          new_list = ("    espressio_ota_coordinator_test\n"
                      "    espressio_ota_coordinator_activation_test\n"
                      "    espressio_ota_coordinator_rollback_test\n"
                      ")")
          if text.count(old_list) != 1:
              raise RuntimeError('native target-list anchor mismatch')
          cmake.write_text(text.replace(old_list, new_list, 1))
      - name: Remove transient workflow
        run: rm .github/workflows/tmp-coordinator-scenario-isolation.yml
      - name: Commit patch
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add tests/ota_coordinator_test.cpp tests/CMakeLists.txt .github/workflows/tmp-coordinator-scenario-isolation.yml
          git commit -m "Isolate coordinator State scenarios by process"
          git push origin HEAD:ota_v1
