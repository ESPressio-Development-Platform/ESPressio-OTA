name: P7 coordinator plan binding

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply coordinator verified Manifest plan binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Bind verified Manifest to deterministic UpdatePlan
        run: python -c "import base64; exec(base64.b64decode(''))"