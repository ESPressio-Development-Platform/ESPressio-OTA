name: P7 coordinator plan binding

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply coordinator verified Manifest plan binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Bind verified Manifest to deterministic UpdatePlan
        run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')))"
      - name: Remove transient workflow
        run: rm .github/workflows/p7-plan-binding.yml
      - name: Commit increment
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add src/ESPressio_OTACoordinator.hpp tests/ota_coordinator_test.cpp .github/workflows/p7-plan-binding.yml
          git commit -m "Bind verified OTA Manifest to deterministic UpdatePlan"
          git push origin HEAD:ota_v1
