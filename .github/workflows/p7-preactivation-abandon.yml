name: P7 pre-activation abandonment support

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Apply OTA pre-activation abandonment support'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Add durable pre-activation abandonment
        shell: python
        run: |
          from pathlib import Path
          durable = Path('src/ESPressio_OTADurable.hpp')
          text = durable.read_text()
          anchor = "    OTADurableStatus ArmActivation(\n"
          method = ("    OTADurableStatus AbandonTransaction(UpdateTransactionId transaction) noexcept {\n"
                    "        if (!transaction) return OTADurableStatus::Invalid;\n"
                    "        const auto ready = MutationReady();\n"
                    "        if (ready != OTADurableStatus::Success) return ready;\n"
                    "        OTAControlRecord<TCapacityProfile> record;\n"
                    "        auto status = ReadCommitted(record);\n"
                    "        if (status != OTADurableStatus::Success) return status;\n"
                    "        if (!record.HasActiveTransaction) return OTADurableStatus::NoActiveTransaction;\n"
                    "        if (record.Active.Transaction != transaction) return OTADurableStatus::TransactionMismatch;\n"
                    "        if (record.Intent != DurableIntent::None || record.Active.Point >= RecoveryPoint::ActivationSelected) {\n"
                    "            return OTADurableStatus::InvalidTransition;\n"
                    "        }\n"
                    "        ClearActive(record);\n"
                    "        return Commit(record);\n"
                    "    }\n\n")
          if text.count(anchor) != 1 or 'OTADurableStatus AbandonTransaction(' in text:
              raise RuntimeError('unexpected durable source state')
          text = text.replace(anchor, method + anchor, 1)
          durable.write_text(text)

          test = Path('tests/ota_durable_test.cpp')
          text = test.read_text()
          anchor = "    FakeAtomicRecordStore store;\n"
          block = ("    {\n"
                   "        FakeAtomicRecordStore cancellationStore;\n"
                   "        OTAControlStore<Capacity> cancellationControl{cancellationStore};\n"
                   "        if (cancellationControl.ProvisionBaseline(FactoryBaseline(), SecurityGeneration{0U}) != OTADurableStatus::Success) return 100;\n"
                   "        ActiveTransactionRecord cancelled;\n"
                   "        if (cancellationControl.BeginTransaction(ReleaseIdentifier{7U}, ManifestIdentifier{Id(7U)}, SecurityGeneration{0U}, cancelled) != OTADurableStatus::Success) return 101;\n"
                   "        if (cancellationControl.AbandonTransaction(cancelled.Transaction) != OTADurableStatus::Success) return 102;\n"
                   "        OTAControlRecord<Capacity> cancellationLoaded;\n"
                   "        if (cancellationControl.Load(cancellationLoaded) != OTADurableStatus::Success || cancellationLoaded.HasActiveTransaction) return 103;\n"
                   "        ActiveTransactionRecord replacement;\n"
                   "        if (cancellationControl.BeginTransaction(ReleaseIdentifier{8U}, ManifestIdentifier{Id(8U)}, SecurityGeneration{0U}, replacement) != OTADurableStatus::Success) return 104;\n"
                   "        if (replacement.Transaction != UpdateTransactionId{2U} || replacement.CandidateGeneration != UpdateGenerationId{3U}) return 105;\n"
                   "        if (cancellationControl.AdvanceRecoveryPoint(replacement.Transaction, RecoveryPoint::Staged) != OTADurableStatus::Success) return 106;\n"
                   "        if (cancellationControl.ArmActivation(replacement.Transaction, ESPressio::Platform::OTA::BootTargetIdentifier{2U}, ESPressio::Platform::OTA::BootTargetIdentifier{1U}) != OTADurableStatus::Success) return 107;\n"
                   "        if (cancellationControl.AbandonTransaction(replacement.Transaction) != OTADurableStatus::InvalidTransition) return 108;\n"
                   "    }\n\n")
          if text.count(anchor) != 1:
              raise RuntimeError('unexpected durable test state')
          text = text.replace(anchor, block + anchor, 1)
          test.write_text(text)
      - name: Remove transient workflow
        run: rm .github/workflows/p7-preactivation-abandon.yml
      - name: Commit refinement
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add src/ESPressio_OTADurable.hpp tests/ota_durable_test.cpp .github/workflows/p7-preactivation-abandon.yml
          git commit -m "Support pre-activation OTA transaction abandonment"
          git push origin HEAD:ota_v1
