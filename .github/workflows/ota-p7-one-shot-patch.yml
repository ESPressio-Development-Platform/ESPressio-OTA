name: OTA P7 One-Shot Coordinator Patch

on:
  push:
    branches: [ota_v1]
    paths:
      - '.github/ota_p7_coordinator_patch.py'
      - '.github/workflows/ota-p7-one-shot-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
          fetch-depth: 0
      - name: Apply Coordinator integration
        run: python3 .github/ota_p7_coordinator_patch.py
      - name: Remove one-shot patch machinery
        run: rm .github/ota_p7_coordinator_patch.py .github/workflows/ota-p7-one-shot-patch.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate component lifecycle execution into Coordinator"
          git push origin HEAD:ota_v1
