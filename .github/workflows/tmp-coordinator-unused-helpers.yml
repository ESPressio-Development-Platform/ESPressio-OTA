name: Temporary Coordinator helper warning fix

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix coordinator scenario helper warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Mark shared scenario helpers intentionally maybe-unused
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/ota_coordinator_test.cpp')
          text = path.read_text()
          replacements = {
              'Manifest<Capacity> CandidateManifest(': '[[maybe_unused]] Manifest<Capacity> CandidateManifest(',
              'bool AdvanceToStaged(OTAControlStore<Capacity>& control, UpdateTransactionId transaction) {': '[[maybe_unused]] bool AdvanceToStaged(OTAControlStore<Capacity>& control, UpdateTransactionId transaction) {'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f'unexpected helper anchor count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Remove transient workflow
        run: rm .github/workflows/tmp-coordinator-unused-helpers.yml
      - name: Commit patch
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add tests/ota_coordinator_test.cpp .github/workflows/tmp-coordinator-unused-helpers.yml
          git commit -m "Mark isolated coordinator helpers maybe unused"
          git push origin HEAD:ota_v1
