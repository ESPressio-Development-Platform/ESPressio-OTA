name: OTA P10 Cross-Version Test Patch

on:
  push:
    branches: [ota_v1]
    paths: [.github/workflows/ota-p10-cross-version-test-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Add pre-activation recovery compatibility regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          test = 'tests/ota_coordinator_test.cpp'
          marker = '''\n#else\n#error Unsupported ESPRESSIO_OTA_COORDINATOR_SCENARIO\n#endif\n'''
          scenario = '''\n#elif ESPRESSIO_OTA_COORDINATOR_SCENARIO == 6\n    {\n        Fixture fixture;\n        if (!fixture.InitializeState()) return 120;\n        if (fixture.Control.ProvisionBaseline(FactoryBaseline(), SecurityGeneration{0U}) != OTADurableStatus::Success) return 121;\n        auto coordinator = fixture.MakeCoordinator(5'000'000'000ULL);\n        if (!coordinator.Initialize()) return 122;\n\n        auto manifest = CandidateManifest(60U, 60U, 1U, false);\n        // The package is structurally valid but the signed candidate-runtime\n        // declaration says it can read only durable schema V2, while this\n        // active transaction is inherited in V1. It must never be armed.\n        manifest.CandidateDurableSchemaSupport = OTAVersionSupport{2U, 2U, 2U};\n        if (ValidateManifest(manifest) != ManifestStatus::Success) return 123;\n\n        UpdateTransactionId transaction;\n        if (!coordinator.Start({ReleaseIdentifier{60U}, ManifestIdentifier{Id(60U)}, SecurityGeneration{1U}}, transaction)) return 124;\n        if (!coordinator.BindVerifiedManifest(manifest, fixture.TargetProfile)) return 125;\n        if (!DriveToStaged(coordinator, fixture.Control, transaction)) return 126;\n\n        const auto rejected = coordinator.BeginActivation(\n            {transaction, Platform::OTA::BootTargetIdentifier{2U}, true, true, true});\n        if (rejected.Outcome != OutcomeClass::Unsupported ||\n            rejected.Detail.Domain != DiagnosticDomain::OTA ||\n            rejected.Detail.Reason != static_cast<std::uint32_t>(\n                CoordinatorCoreReason::CandidateCannotReadCurrentOTASchema)) return 127;\n\n        OTAControlRecord<Capacity> stillStaged;\n        if (fixture.Control.Load(stillStaged) != OTADurableStatus::Success ||\n            stillStaged.Intent != DurableIntent::None ||\n            stillStaged.Active.Point != RecoveryPoint::Staged ||\n            stillStaged.Active.CandidateBootTarget ||\n            fixture.Boot.Next != Platform::OTA::BootTargetIdentifier{1U} ||\n            fixture.ComponentHandler.ActivateCalls != 0U) return 128;\n    }\n\n#else\n#error Unsupported ESPRESSIO_OTA_COORDINATOR_SCENARIO\n#endif\n'''
          replace_once(test, marker, scenario)

          cmake = 'tests/CMakeLists.txt'
          marker = '''add_test(NAME espressio_ota_coordinator_staging_recovery_test COMMAND espressio_ota_coordinator_staging_recovery_test)\n\nadd_executable(espressio_ota_optional_bridges_test'''
          replacement = '''add_test(NAME espressio_ota_coordinator_staging_recovery_test COMMAND espressio_ota_coordinator_staging_recovery_test)\n\nadd_executable(espressio_ota_coordinator_cross_version_test ota_coordinator_test.cpp)\ntarget_link_libraries(espressio_ota_coordinator_cross_version_test PRIVATE ESPressio::OTA)\ntarget_compile_options(espressio_ota_coordinator_cross_version_test PRIVATE ${ESPRESSIO_OTA_NATIVE_COMPILE_OPTIONS})\ntarget_compile_definitions(espressio_ota_coordinator_cross_version_test PRIVATE ESPRESSIO_OTA_COORDINATOR_SCENARIO=6)\nadd_test(NAME espressio_ota_coordinator_cross_version_test COMMAND espressio_ota_coordinator_cross_version_test)\n\nadd_executable(espressio_ota_optional_bridges_test'''
          replace_once(cmake, marker, replacement)
          replace_once(cmake,
              '''    espressio_ota_coordinator_staging_recovery_test\n    espressio_ota_optional_bridges_test''',
              '''    espressio_ota_coordinator_staging_recovery_test\n    espressio_ota_coordinator_cross_version_test\n    espressio_ota_optional_bridges_test''')
          PY
          rm .github/workflows/ota-p10-cross-version-test-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Test pre-activation recovery schema rejection'
          git push origin HEAD:ota_v1
