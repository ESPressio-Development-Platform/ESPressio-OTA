name: OTA Candidate Trial Recovery Fix

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Patch Coordinator candidate recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ESPressio_OTACoordinator.hpp')
          s = p.read_text()

          marker = '''    ArtifactSourceRetryExhausted
          };
          '''
          replacement = '''    ArtifactSourceRetryExhausted,
              CandidateTrialRejected
          };
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)

          marker = '''    bool activationRestartIssued_{false};
              bool rollbackRestartIssued_{false};
          '''
          replacement = '''    bool activationRestartIssued_{false};
              bool rollbackRestartIssued_{false};
              bool activationRecovered_{false};
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)

          marker = '''        activationRestartIssued_ = false;
              rollbackRestartIssued_ = false;
              verifiedManifestBound_ = false;
          '''
          replacement = '''        activationRestartIssued_ = false;
              rollbackRestartIssued_ = false;
              activationRecovered_ = false;
              verifiedManifestBound_ = false;
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)

          old = '''        if (record.Intent == DurableIntent::ActivationArmed) {
                  if (current == record.Active.CandidateBootTarget) {
                      if (!trial_.IsCurrentBootTrial()) return RecoveryRequired(&record);
                      executingCandidate = true;
                  } else if (current != record.Active.PreviousCommittedBootTarget) {
                      return RecoveryRequired(&record);
                  }
                  lifecycle = UpdateLifecycle::Activating;
          '''
          new = '''        if (record.Intent == DurableIntent::ActivationArmed) {
                  if (current == record.Active.CandidateBootTarget) {
                      if (!trial_.IsCurrentBootTrial()) return RecoveryRequired(&record);
                      executingCandidate = true;
                  } else if (current == record.Active.PreviousCommittedBootTarget) {
                      activationRecovered_ = true;
                  } else {
                      return RecoveryRequired(&record);
                  }
                  lifecycle = UpdateLifecycle::Activating;
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = '''        componentLifecycle_.Reset();
              activationRestartIssued_ = false;
              if (!PublishActive(record, UpdateLifecycle::Activating, false)) return ProjectionFailure();
          '''
          replacement = '''        componentLifecycle_.Reset();
              activationRestartIssued_ = false;
              activationRecovered_ = false;
              if (!PublishActive(record, UpdateLifecycle::Activating, false)) return ProjectionFailure();
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)

          old = '''        if (record.Intent == DurableIntent::ActivationArmed) {
                  const auto componentStep = AdvanceComponentLifecycle(
                      record, ComponentLifecycleOperation::Activate);
          '''
          new = '''        if (record.Intent == DurableIntent::ActivationArmed) {
                  if (activationRecovered_) {
                      if constexpr (!Platform::OTA::HasTrialBootStateInspectionV<TTrialBoot>) {
                          return RecoveryRequired(&record);
                      } else {
                          const auto inspected = trial_.InspectBootTargetTrialState(
                              record.Active.CandidateBootTarget);
                          if (!inspected) return RecoveryRequired(&record);
                          switch (inspected.State) {
                              case Platform::OTA::TrialBootState::NeverAttempted:
                              case Platform::OTA::TrialBootState::Armed:
                                  activationRecovered_ = false;
                                  break;
                              case Platform::OTA::TrialBootState::Rejected:
                                  activationRecovered_ = false;
                                  return StartRollback(record, CoordinatorDetail::CoreResult(
                                      OutcomeClass::Failed, CoordinatorCoreReason::CandidateTrialRejected));
                              case Platform::OTA::TrialBootState::Unknown:
                              case Platform::OTA::TrialBootState::Untracked:
                              case Platform::OTA::TrialBootState::PendingValidation:
                              case Platform::OTA::TrialBootState::Accepted:
                                  return RecoveryRequired(&record);
                          }
                      }
                  }

                  const auto componentStep = AdvanceComponentLifecycle(
                      record, ComponentLifecycleOperation::Activate);
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''            if (current == record.Active.PreviousCommittedBootTarget) {
                      if (componentLifecycle_.RestartRequired() && !rollbackRestartIssued_) {
          '''
          new = '''            if (current == record.Active.PreviousCommittedBootTarget) {
                      if (boot_.NextBootTarget() != record.Active.PreviousCommittedBootTarget) {
                          const auto selected = CoordinatorDetail::PlatformResult(
                              boot_.SelectNextBootTarget(record.Active.PreviousCommittedBootTarget));
                          if (selected.Outcome != OutcomeClass::Success) return selected;
                          if (!PublishActive(record, UpdateLifecycle::RollingBack, false, true)) return ProjectionFailure();
                          return {OutcomeClass::Pending, {}};
                      }
                      if (componentLifecycle_.RestartRequired() && !rollbackRestartIssued_) {
          '''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/ota_coordinator_platform_recovery_test.cpp')
          s = p.read_text()
          marker = '''    bool Trial{false};
              Platform::OTA::Status MarkValidStatus{Platform::OTA::Status::Success};
          '''
          replacement = '''    bool Trial{false};
              Platform::OTA::TrialBootState CandidateState{Platform::OTA::TrialBootState::NeverAttempted};
              Platform::OTA::Status InspectStatus{Platform::OTA::Status::Success};
              std::size_t InspectCalls{0U};
              Platform::OTA::Status MarkValidStatus{Platform::OTA::Status::Success};
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          marker = '''    bool IsCurrentBootTrial() const noexcept { return Trial; }
              Platform::OTA::Result MarkCurrentBootValid() noexcept {
          '''
          replacement = '''    bool IsCurrentBootTrial() const noexcept { return Trial; }
              Platform::OTA::TrialBootStateResult InspectBootTargetTrialState(
                  Platform::OTA::BootTargetIdentifier target) const noexcept {
                  auto* self = const_cast<FaultTrialBoot*>(this);
                  ++self->InspectCalls;
                  if (!target) return {Platform::OTA::Status::Invalid, Platform::OTA::TrialBootState::Unknown, -105};
                  return {InspectStatus, InspectStatus == Platform::OTA::Status::Success
                      ? CandidateState : Platform::OTA::TrialBootState::Unknown,
                      InspectStatus == Platform::OTA::Status::Success ? 0 : -106};
              }
              Platform::OTA::Result MarkCurrentBootValid() noexcept {
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)

          marker = '''        if (!LoadActive(fixture, record) || record.Active.Point != RecoveryPoint::TrialBootEntered ||
                  record.Intent != DurableIntent::None) return 18;
              }
          #elif ESPRESSIO_OTA_PLATFORM_RECOVERY_SCENARIO == 2
          '''
          replacement = '''        if (!LoadActive(fixture, record) || record.Active.Point != RecoveryPoint::TrialBootEntered ||
                  record.Intent != DurableIntent::None) return 18;
              }

              // If the platform has already rejected the candidate after a Trial reset,
              // recovered ActivationArmed must never re-arm it. Persist rollback instead.
              {
                  Fixture fixture;
                  if (!fixture.InitializeRuntime()) return 51;
                  ActiveTransactionRecord active;
                  if (!fixture.CreateStaged(11U, active)) return 52;
                  const auto manifest = CandidateManifest(11U);
                  if (fixture.Control.ArmActivation(active.Transaction, Platform::OTA::BootTargetIdentifier{2U},
                                                    Platform::OTA::BootTargetIdentifier{1U}) != OTADurableStatus::Success) return 53;
                  fixture.Handler.Recovery = ComponentRecoveryState::Activated;
                  fixture.Boot.Current = Platform::OTA::BootTargetIdentifier{1U};
                  fixture.Boot.Next = Platform::OTA::BootTargetIdentifier{1U};
                  fixture.Trial.CandidateState = Platform::OTA::TrialBootState::Rejected;

                  auto coordinator = fixture.MakeCoordinator();
                  if (!coordinator.Initialize() || !coordinator.BindVerifiedManifest(manifest, fixture.TargetProfile)) return 54;
                  const auto rejected = coordinator.Advance();
                  if (rejected.Outcome != OutcomeClass::Failed ||
                      rejected.Detail.Reason != static_cast<std::uint32_t>(CoordinatorCoreReason::CandidateTrialRejected) ||
                      fixture.Boot.SelectCalls != 0U || fixture.Trial.InspectCalls != 1U) return 55;

                  OTAControlRecord<Capacity> record;
                  if (!LoadActive(fixture, record) || record.Intent != DurableIntent::RollbackIntent ||
                      fixture.Boot.Next != Platform::OTA::BootTargetIdentifier{1U}) return 56;

                  // Even if a backend reports previous as current while next still points
                  // at candidate, rollback must normalize next before clearing durability.
                  fixture.Boot.Next = Platform::OTA::BootTargetIdentifier{2U};
                  const auto normalize = coordinator.Advance();
                  if (normalize.Outcome != OutcomeClass::Pending ||
                      fixture.Boot.Next != Platform::OTA::BootTargetIdentifier{1U} ||
                      fixture.Boot.SelectCalls != 1U) return 57;
                  if (!LoadActive(fixture, record) || record.Intent != DurableIntent::RollbackIntent) return 58;
                  if (!coordinator.Advance()) return 59;
                  if (fixture.Control.Load(record) != OTADurableStatus::Success || record.HasActiveTransaction ||
                      record.Committed.Generation != UpdateGenerationId{1U}) return 60;
              }
          #elif ESPRESSIO_OTA_PLATFORM_RECOVERY_SCENARIO == 2
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ESPressio_OTACoordinator.hpp tests/ota_coordinator_platform_recovery_test.cpp
          git commit -m "fix: reconcile rejected OTA trial candidates"
          git push origin HEAD:ota_v1