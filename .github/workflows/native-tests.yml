name: OTA Native Tests

on:
  push:
    branches:
      - ota_v1
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: ota_v1
          path: deps/ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Platform
          ref: ota_v1
          path: deps/ESPressio-Platform
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Persistence
          ref: ota_v1
          path: deps/ESPressio-Persistence
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: ota_v1
          path: deps/ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: ota_v1
          path: deps/ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: deps/ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: deps/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: deps/ESPressio-Observable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: deps/ESPressio-Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: primitives_redesign
          path: deps/ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: deps/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-State
          ref: primitives_redesign
          path: deps/ESPressio-State
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: primitives_redesign
          path: deps/ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Command
          ref: primitives_redesign
          path: deps/ESPressio-Command
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: OTA constrained object footprint report
        run: ./build/tests/espressio_ota_offer_test
      - name: OTA retained-memory accounting report
        run: ./build/tests/espressio_ota_memory_accounting_test
      - name: Temporary platform recovery diagnostic
        run: ./build/tests/espressio_ota_coordinator_platform_recovery_diagnostic
      - name: Test
        run: ctest --test-dir build --output-on-failure
