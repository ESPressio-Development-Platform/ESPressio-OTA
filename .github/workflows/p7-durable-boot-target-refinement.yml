name: P7 durable boot-target refinement

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message == 'Apply OTA durable boot target recovery refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Refine durable boot-target recovery contract
        shell: python
        run: |
          from pathlib import Path

          durable = Path('src/ESPressio_OTADurable.hpp')
          text = durable.read_text()

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'durable replacement count={count}: {old!r}')
              text = text.replace(old, new, 1)

          once('#include "ESPressio_IAtomicRecordStore.hpp"\n',
               '#include "ESPressio_IAtomicRecordStore.hpp"\n#include <ESPressio_PlatformOTA.hpp>\n')

          once('    SecurityGeneration CandidateSecurity{};\n    RecoveryPoint Point{RecoveryPoint::None};',
               '    SecurityGeneration CandidateSecurity{};\n    Platform::OTA::BootTargetIdentifier CandidateBootTarget{};\n    Platform::OTA::BootTargetIdentifier PreviousCommittedBootTarget{};\n    RecoveryPoint Point{RecoveryPoint::None};')

          once('''    constexpr bool IsValid() const noexcept {
              return bool(Transaction) && bool(CandidateGeneration) && bool(PreviousCommittedGeneration) &&
                     bool(Release) && bool(Manifest) && Point != RecoveryPoint::None &&
                     Point != RecoveryPoint::Committed && Point != RecoveryPoint::RolledBack;
          }'''.replace('          ', ''),
               '''    constexpr bool IsValid() const noexcept {
              if (!Transaction || !CandidateGeneration || !PreviousCommittedGeneration ||
                  !Release || !Manifest || Point == RecoveryPoint::None ||
                  Point == RecoveryPoint::Committed || Point == RecoveryPoint::RolledBack) return false;
              const bool activationArmed = Point >= RecoveryPoint::ActivationSelected;
              if (activationArmed) {
                  if (!CandidateBootTarget || !PreviousCommittedBootTarget ||
                      CandidateBootTarget == PreviousCommittedBootTarget) return false;
              } else if (CandidateBootTarget || PreviousCommittedBootTarget) {
                  return false;
              }
              return true;
          }'''.replace('          ', ''))

          once('''    constexpr bool IsEmpty() const noexcept {
              return !Transaction && !CandidateGeneration && !PreviousCommittedGeneration && !Release && !Manifest &&
                     CandidateSecurity.Value() == 0U && Point == RecoveryPoint::None;
          }'''.replace('          ', ''),
               '''    constexpr bool IsEmpty() const noexcept {
              return !Transaction && !CandidateGeneration && !PreviousCommittedGeneration && !Release && !Manifest &&
                     CandidateSecurity.Value() == 0U && !CandidateBootTarget && !PreviousCommittedBootTarget &&
                     Point == RecoveryPoint::None;
          }'''.replace('          ', ''))

          once('inline constexpr std::size_t OTAControlEncodedBytesV1 = 136U;',
               'inline constexpr std::size_t OTAControlEncodedBytesV1 = 144U;')

          once('    DurableDetail::WriteLE(cursor, record.Active.CandidateSecurity.Value());\n    *cursor++ = static_cast<std::uint8_t>(record.Active.Point);',
               '    DurableDetail::WriteLE(cursor, record.Active.CandidateSecurity.Value());\n    DurableDetail::WriteLE(cursor, record.Active.CandidateBootTarget.Value());\n    DurableDetail::WriteLE(cursor, record.Active.PreviousCommittedBootTarget.Value());\n    *cursor++ = static_cast<std::uint8_t>(record.Active.Point);')

          once('    std::uint64_t activeSecurity = 0U;\n\n    if (!DurableDetail::ReadLE(cursor, end, nextTransaction) ||',
               '    std::uint64_t activeSecurity = 0U;\n    std::uint32_t candidateBootTarget = 0U;\n    std::uint32_t previousCommittedBootTarget = 0U;\n\n    if (!DurableDetail::ReadLE(cursor, end, nextTransaction) ||')

          once('    if (!DurableDetail::ReadLE(cursor, end, activeSecurity) || cursor == end) return OTADurableStatus::Corrupt;\n    const auto recoveryRaw = *cursor++;',
               '    if (!DurableDetail::ReadLE(cursor, end, activeSecurity) ||\n        !DurableDetail::ReadLE(cursor, end, candidateBootTarget) ||\n        !DurableDetail::ReadLE(cursor, end, previousCommittedBootTarget) || cursor == end) {\n        return OTADurableStatus::Corrupt;\n    }\n    const auto recoveryRaw = *cursor++;')

          once('    candidate.Active.CandidateSecurity = SecurityGeneration{activeSecurity};\n    candidate.Active.Point = static_cast<RecoveryPoint>(recoveryRaw);',
               '    candidate.Active.CandidateSecurity = SecurityGeneration{activeSecurity};\n    candidate.Active.CandidateBootTarget = Platform::OTA::BootTargetIdentifier{candidateBootTarget};\n    candidate.Active.PreviousCommittedBootTarget = Platform::OTA::BootTargetIdentifier{previousCommittedBootTarget};\n    candidate.Active.Point = static_cast<RecoveryPoint>(recoveryRaw);')

          once('    OTADurableStatus ArmActivation(UpdateTransactionId transaction) noexcept {',
               '    OTADurableStatus ArmActivation(\n        UpdateTransactionId transaction,\n        Platform::OTA::BootTargetIdentifier candidateBootTarget,\n        Platform::OTA::BootTargetIdentifier previousCommittedBootTarget) noexcept {\n        if (!transaction || !candidateBootTarget || !previousCommittedBootTarget ||\n            candidateBootTarget == previousCommittedBootTarget) return OTADurableStatus::Invalid;')

          once('        record.Active.Point = RecoveryPoint::ActivationSelected;\n        record.Intent = DurableIntent::ActivationArmed;',
               '        record.Active.CandidateBootTarget = candidateBootTarget;\n        record.Active.PreviousCommittedBootTarget = previousCommittedBootTarget;\n        record.Active.Point = RecoveryPoint::ActivationSelected;\n        record.Intent = DurableIntent::ActivationArmed;')

          once('        if (record.Intent == DurableIntent::CommitIntent) return OTADurableStatus::InvalidTransition;\n        record.Active.Point = RecoveryPoint::RollbackStarted;',
               '        if (record.Intent == DurableIntent::CommitIntent ||\n            record.Active.Point < RecoveryPoint::ActivationSelected ||\n            record.Active.Point == RecoveryPoint::RollbackStarted) return OTADurableStatus::InvalidTransition;\n        record.Active.Point = RecoveryPoint::RollbackStarted;')

          durable.write_text(text)

          test = Path('tests/ota_durable_test.cpp')
          text = test.read_text()

          def test_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'test replacement count={count}: {old!r}')
              text = text.replace(old, new, 1)

          test_once('afterRestart.ArmActivation(first.Transaction)',
                    'afterRestart.ArmActivation(first.Transaction, ESPressio::Platform::OTA::BootTargetIdentifier{2U}, ESPressio::Platform::OTA::BootTargetIdentifier{1U})')

          test_once('    if (afterRestart.MarkTrialEntered(first.Transaction) != OTADurableStatus::Success) return 17;',
                    '    if (afterRestart.Load(loaded) != OTADurableStatus::Success ||\n        loaded.Active.CandidateBootTarget != ESPressio::Platform::OTA::BootTargetIdentifier{2U} ||\n        loaded.Active.PreviousCommittedBootTarget != ESPressio::Platform::OTA::BootTargetIdentifier{1U}) return 160;\n    if (afterRestart.MarkTrialEntered(first.Transaction) != OTADurableStatus::Success) return 17;')

          test_once('    if (second.Transaction != UpdateTransactionId{2U} || second.CandidateGeneration != UpdateGenerationId{3U}) return 23;\n    if (afterRestart.PersistRollbackIntent(second.Transaction) != OTADurableStatus::Success) return 24;',
                    '    if (second.Transaction != UpdateTransactionId{2U} || second.CandidateGeneration != UpdateGenerationId{3U}) return 23;\n    if (afterRestart.PersistRollbackIntent(second.Transaction) != OTADurableStatus::InvalidTransition) return 230;\n    if (afterRestart.AdvanceRecoveryPoint(second.Transaction, RecoveryPoint::Staged) != OTADurableStatus::Success) return 231;\n    if (afterRestart.ArmActivation(second.Transaction, ESPressio::Platform::OTA::BootTargetIdentifier{3U}, ESPressio::Platform::OTA::BootTargetIdentifier{3U}) != OTADurableStatus::Invalid) return 232;\n    if (afterRestart.ArmActivation(second.Transaction, ESPressio::Platform::OTA::BootTargetIdentifier{3U}, ESPressio::Platform::OTA::BootTargetIdentifier{2U}) != OTADurableStatus::Success) return 233;\n    if (afterRestart.Load(loaded) != OTADurableStatus::Success ||\n        loaded.Active.CandidateBootTarget != ESPressio::Platform::OTA::BootTargetIdentifier{3U} ||\n        loaded.Active.PreviousCommittedBootTarget != ESPressio::Platform::OTA::BootTargetIdentifier{2U}) return 234;\n    if (afterRestart.PersistRollbackIntent(second.Transaction) != OTADurableStatus::Success) return 24;')

          test.write_text(text)
      - name: Remove transient refinement workflow
        run: rm .github/workflows/p7-durable-boot-target-refinement.yml
      - name: Commit refinement
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add src/ESPressio_OTADurable.hpp tests/ota_durable_test.cpp .github/workflows/p7-durable-boot-target-refinement.yml
          git commit -m "Bind durable OTA recovery to boot targets"
          git push origin HEAD:ota_v1
