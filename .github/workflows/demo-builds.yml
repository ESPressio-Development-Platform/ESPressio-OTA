name: OTA rollback ordering patch carrier

on:
  push:
    branches:
      - ota_v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: retry OTA rollback ordering patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
          fetch-depth: 0

      - name: Apply rollback ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ESPressio_OTACoordinator.hpp')
          text = path.read_text()

          old = '''            if (current != record.Active.CandidateBootTarget) return RecoveryRequired(&record);
            if (boot_.NextBootTarget() != record.Active.PreviousCommittedBootTarget) {
                const auto mapped = CoordinatorDetail::PlatformResult(
                    boot_.SelectNextBootTarget(record.Active.PreviousCommittedBootTarget));
                if (mapped.Outcome != OutcomeClass::Success) return mapped;
                if (!PublishActive(record, UpdateLifecycle::RollingBack, true, true)) return ProjectionFailure();
                return {OutcomeClass::Pending, {}};
            }
            if (trial_.IsCurrentBootTrial()) {
                const auto mapped = CoordinatorDetail::PlatformResult(trial_.MarkCurrentBootInvalid());
                if (mapped.Outcome != OutcomeClass::Success && mapped.Outcome != OutcomeClass::Pending) return mapped;
                if (!PublishActive(record, UpdateLifecycle::RollingBack, true, true)) return ProjectionFailure();
                return {OutcomeClass::Pending, {}};
            }
          '''

          new = '''            if (current != record.Active.CandidateBootTarget) return RecoveryRequired(&record);
            if (trial_.IsCurrentBootTrial()) {
                const auto mapped = CoordinatorDetail::PlatformResult(trial_.MarkCurrentBootInvalid());
                if (mapped.Outcome != OutcomeClass::Success && mapped.Outcome != OutcomeClass::Pending) return mapped;
                if (!PublishActive(record, UpdateLifecycle::RollingBack, true, true)) return ProjectionFailure();
                return {OutcomeClass::Pending, {}};
            }
            if (boot_.NextBootTarget() != record.Active.PreviousCommittedBootTarget) {
                const auto mapped = CoordinatorDetail::PlatformResult(
                    boot_.SelectNextBootTarget(record.Active.PreviousCommittedBootTarget));
                if (mapped.Outcome != OutcomeClass::Success) return mapped;
                if (!PublishActive(record, UpdateLifecycle::RollingBack, true, true)) return ProjectionFailure();
                return {OutcomeClass::Pending, {}};
            }
          '''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one rollback block, found {count}')
          path.write_text(text.replace(old, new))
          PY

          git checkout f9ec960f686dec4f34ab0bf3820f5b3639b5fd78 -- .github/workflows/demo-builds.yml
          rm -f .github/workflows/ota-rollback-ordering-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ESPressio_OTACoordinator.hpp .github/workflows/demo-builds.yml .github/workflows/ota-rollback-ordering-fix.yml
          git diff --cached --check
          git commit -m "fix: invalidate trial before selecting rollback target"
          git push origin HEAD:ota_v1
