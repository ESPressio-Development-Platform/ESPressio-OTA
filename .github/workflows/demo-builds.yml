name: OTA Trial Recovery Test Patch Carrier

on:
  push:
    branches:
      - ota_v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Add rejected-trial regression coverage
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit regression coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ota_coordinator_platform_recovery_test.cpp
          git diff --cached --quiet && exit 0
          git commit -m "test: cover rejected OTA trial recovery"
          git push origin HEAD:ota_v1