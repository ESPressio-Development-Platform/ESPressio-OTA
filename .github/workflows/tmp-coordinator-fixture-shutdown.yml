name: Temporary Coordinator fixture shutdown

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply coordinator fixture state shutdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Patch fixture lifetime
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/ota_coordinator_test.cpp')
          text = path.read_text()
          anchor = "    HealthConditionEvaluator<ApplicationReadyHealthCondition, 1U> ApplicationReadyEvaluator{ApplicationReadyChecks};\n\n    bool InitializeState() {\n"
          replacement = "    HealthConditionEvaluator<ApplicationReadyHealthCondition, 1U> ApplicationReadyEvaluator{ApplicationReadyChecks};\n\n    ~Fixture() {\n        (void)StateRuntime.Shutdown();\n    }\n\n    bool InitializeState() {\n"
          if text.count(anchor) != 1:
              raise RuntimeError(f'unexpected fixture anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))
      - name: Remove transient workflow
        run: rm .github/workflows/tmp-coordinator-fixture-shutdown.yml
      - name: Commit patch
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add tests/ota_coordinator_test.cpp .github/workflows/tmp-coordinator-fixture-shutdown.yml
          git commit -m "Shutdown coordinator State fixtures between scenarios"
          git push origin HEAD:ota_v1
