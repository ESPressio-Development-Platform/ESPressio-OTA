name: Temporary Coordinator cancellation diagnostic

on:
  push:
    branches: [ota_v1]

permissions:
  contents: write

jobs:
  instrument:
    if: github.event.head_commit.message == 'Instrument OTA coordinator cancellation failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ota_v1
      - name: Add one-shot diagnostic
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/ota_coordinator_test.cpp')
          text = path.read_text()
          old = '#include <cstdint>\n'
          new = '#include <cstdint>\n#include <cstdio>\n'
          if text.count(old) != 1:
              raise RuntimeError('unexpected include anchor')
          text = text.replace(old, new, 1)
          old = '        if (!coordinator.Cancel(first)) return 8;\n'
          new = ('        const auto cancelResult = coordinator.Cancel(first);\n'
                 '        if (!cancelResult) {\n'
                 '            std::printf("cancel outcome=%u domain=%u reason=%u native=%d availability=%u lifecycle=%u\\n",\n'
                 '                static_cast<unsigned>(cancelResult.Outcome),\n'
                 '                static_cast<unsigned>(cancelResult.Detail.Domain),\n'
                 '                static_cast<unsigned>(cancelResult.Detail.Reason),\n'
                 '                static_cast<int>(cancelResult.Detail.NativeCode),\n'
                 '                static_cast<unsigned>(coordinator.Status().Availability),\n'
                 '                static_cast<unsigned>(coordinator.Status().Lifecycle));\n'
                 '            return 8;\n'
                 '        }\n')
          if text.count(old) != 1:
              raise RuntimeError('unexpected cancellation anchor')
          path.write_text(text.replace(old, new, 1))
      - name: Remove transient workflow
        run: rm .github/workflows/tmp-coordinator-cancel-diagnostic.yml
      - name: Commit diagnostic
        run: |
          git config user.name "ESPressio Automation"
          git config user.email "automation@espressio.invalid"
          git add tests/ota_coordinator_test.cpp .github/workflows/tmp-coordinator-cancel-diagnostic.yml
          git commit -m "Instrument coordinator cancellation result"
          git push origin HEAD:ota_v1
