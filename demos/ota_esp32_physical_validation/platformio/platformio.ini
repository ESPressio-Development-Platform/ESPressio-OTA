[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; Physical OTA validation requires two application slots. The minimal-SPIFFS
; table provides OTA_0/OTA_1 while leaving maximum practical room for each app.
board_build.partitions = min_spiffs.csv

build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Platform.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Platform-ESP-IDF.git#ota_v1
