[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    https://github.com/ESPressio-Development-Platform/ESPressio-System.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Platform.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Platform-ESP-IDF.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Security.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-OTA.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-ESP32.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Primitive.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Serializable.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#ota_v1
    https://github.com/ESPressio-Development-Platform/ESPressio-State.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Task.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#primitives_redesign
    https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#primitives_redesign

; The ordinary Arduino environment remains the Arduino-IDE-equivalent compile gate.
; It uses the prebuilt Arduino bootloader and therefore cannot prove Trial/rollback
; behavior unless that bootloader was independently built with rollback support.

[env:esp32dev-rollback]
extends = env:esp32dev
framework = arduino, espidf

; This hybrid Arduino-as-an-ESP-IDF-component environment rebuilds the ESP-IDF
; bootloader. The project-local sdkconfig.defaults enables bootloader rollback and
; Arduino autostart, so this is the environment to flash for physical Trial,
; rollback and power-loss evidence.
